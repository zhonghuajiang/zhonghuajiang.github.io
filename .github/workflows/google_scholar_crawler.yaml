name: Get Citation Data

on:
  page_build:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google_scholar_crawler.yaml'
      - 'google_scholar_crawler/**'
      - '_config.yml'
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: google_scholar_crawler/requirements.txt
    - name: Install requirements
      run: python -m pip install -r google_scholar_crawler/requirements.txt
    - name: Test crawler
      run: python -m unittest discover -s google_scholar_crawler -p test_main.py -v
    - name: Fetch citation data
      working-directory: google_scholar_crawler
      run: python main.py
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
    - name: Publish citation data
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if git ls-remote --exit-code --heads origin google-scholar-stats; then
          git fetch origin google-scholar-stats
          git worktree add stats-branch FETCH_HEAD
        else
          git worktree add --detach stats-branch
          git -C stats-branch checkout --orphan google-scholar-stats
          git -C stats-branch rm -rf .
        fi
        cp google_scholar_crawler/results/*.json stats-branch/
        git -C stats-branch add gs_data.json gs_data_shieldsio.json
        if ! git -C stats-branch diff --cached --quiet; then
          git -C stats-branch commit -m "Updated Citation Data"
          git -C stats-branch push origin HEAD:google-scholar-stats
        fi
